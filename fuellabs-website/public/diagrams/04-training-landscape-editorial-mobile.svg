<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Small-Model Training Landscape</title>
  <desc id="desc">Small-Model Training Landscape. Reported training tokens versus total model parameters. Logarithmic axes. HobbyLM Base: 1.037B total parameters, ~100B scheduled reported tokens (~305M active per token); TinyLlama-1.1B: 1.1B total parameters, 3T reported tokens; Pythia-1B: 1B total parameters, 300B reported tokens; OPT-1.3B: 1.3B total parameters, 200-300B reported tokens (show token range); OLMo-1B: 1B total parameters, 3T reported tokens; OpenELM-1.1B: 1.1B total parameters, 1.5T reported tokens; OpenLM-1B: 1B total parameters, 1.6T reported tokens; MobileLLM-1B: 1B total parameters, 1T reported tokens; Gemma 3 1B: 1B total parameters, 2T reported tokens; SmolLM2-1.7B: 1.7B total parameters, 11T reported tokens; Qwen2.5-1.5B: 1.5B total parameters, 18T reported tokens; Qwen3-1.7B: 1.7B total parameters, 36T reported tokens; Llama 3.2 1B: 1B total parameters, up to 9T reported tokens (label as upper bound); DCLM-1B: 1B total parameters, 4.3T reported tokens; StableLM 2 1.6B: 1.6B total parameters, 2T reported tokens; Granite 3.0 1B-A400M: 1.3B total parameters, 10T reported tokens (400M active per token). A competitive small-model evaluation profile from a comparatively compact reported training budget. Reported token counts are not measures of compute, cost or data quality. Model training recipes and reporting conventions differ.</desc>
  <rect id="paper" width="900" height="1200" fill="#F2EFE8"/>
