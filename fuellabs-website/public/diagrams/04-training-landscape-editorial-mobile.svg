    <text x="48" y="134" font-family="'General Sans', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="500" fill="#11110F" letter-spacing="-0.5">Small-Model Training Landscape</text>
    <text x="48" y="170" font-family="'General Sans', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="400" fill="#66665F">Reported training tokens versus total model parameters</text>
  </g>
