    <text x="48" y="66" font-family="'General Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#66665F" letter-spacing="1.6">REPORTED PRETRAINING CONTEXT</text>
    <text x="48" y="106" font-family="'General Sans', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="500" fill="#11110F" letter-spacing="-0.5">Small-Model Training Landscape</text>
    <text x="1552" y="106" font-family="'General Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#66665F" text-anchor="end">Reported training tokens versus total model parameters</text>
    <line x1="48" y1="124" x2="1552" y2="124" stroke="#D8D4C9" stroke-width="1"/>
  </g>
